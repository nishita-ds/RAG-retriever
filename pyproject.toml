[project]
name = "rag-retriever"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nishita-ds", email = "nishita16j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-retriever = "rag_retriever:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
